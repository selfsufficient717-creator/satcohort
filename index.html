const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-US').replace(/,/g,' ')+' UZS';
const uid=()=>Math.random().toString(36).slice(2,9);
const ld=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const today=()=>ld(new Date());
const ym=()=>today().slice(0,7);
const cyrb53=(str,seed=0)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)};
const hash=p=>'h'+cyrb53(String(p)+CONFIG.salt).toString(36);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fdate=d=>new Date(d.length===10?d+'T00:00:00':d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const fmonth=m=>new Date(m+'-01T00:00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'});
const tgLink=t=>'https://t.me/'+CONFIG.tg+'?text='+encodeURIComponent(t);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const lastDay=m=>{const [y,mo]=m.split('-').map(Number);return ld(new Date(y,mo,0))};
const months=()=>{const out=[],[y,m]=CONFIG.start.slice(0,7).split('-').map(Number);for(let i=0;i<30;i++){const d=new Date(y,m-1+i,1);out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))}return out};
function left(ms){if(ms<=0)return '0m';const m=Math.floor(ms/60000),d=Math.floor(m/1440),h=Math.floor(m%1440/60);return d?d+'d '+h+'h':h?h+'h '+(m%60)+'m':m+'m'}

/* ---------- dashboard ---------- */
const TABS=[['overview','Overview'],['lessons','Lessons'],['type','Type practice'],['mock','Mock tests'],['exam','Monthly exam'],['vocab','Vocabulary'],['tracker','Tracker'],['coins','Coins'],['account','Account']];
function dashHtml(u){
 const red=failedMonths(u).length>0;
 const body={overview:dOverview,lessons:dLessons,type:dType,mock:dMock,exam:dExam,vocab:dVocab,tracker:dTracker,coins:dCoins,account:dAccount}[S.tab](u);
 const redBanner=red?`<div class="alert red" role="alert"><div class="ai">⛔</div><div class="at"><b>Your account is RED — monthly minimum score not reached</b><span>Missed: ${failedMonths(u).map(m=>fmonth(m)+' (min '+CONFIG.targets[m]+')').join(', ')}. To restore it, earn ${CONFIG.coinsToRestore} coins by solving math &amp; logic problems.</span></div><button class="btn dark sm" data-act="tab" data-t="coins">Earn coins</button></div>`:'';
 return `<div class="wrap ${red?'redmode':''}"><div class="dhead"><div class="eyebrow">Student dashboard</div><h2 class="h2" style="font-size:32px;margin-bottom:4px">Hello, ${esc(u.name.split(' ')[0])} ${red?'🔴':''}</h2></div>${payBanner(u)}${satBanner()}${redBanner}<div class="tabs" style="margin-top:16px">${TABS.map(t=>`<button class="tab ${S.tab===t[0]?'on':''}" data-act="tab" data-t="${t[0]}">${t[1]}</button>`).join('')}</div><div style="padding-bottom:70px">${body}</div></div>`;
}
const gate=(msg)=>`<div class="card ctr"><div class="ico" style="margin:0 auto 14px">🔒</div><h3>Enrolment required</h3><p style="margin:8px 0 18px">${msg}</p><button class="btn gold" data-act="enrol" data-p="cohort">Pay via Telegram · ${fmt(PLANS[0].price)}</button></div>`;
const hwStatus=(u,l)=>{const i=l.n-1,due=hwDue(i),sub=u.prog.hw[l.id];if(sub)return{t:'Submitted',c:'ok'};if(Date.now()>due)return{t:'Overdue',c:'bad'};return{t:left(due-Date.now())+' left',c:'gold'}};
function dOverview(u){
 const lp=LESSONS.filter(l=>u.prog.lessons[l.id]).length,hp=LESSONS.filter(l=>u.prog.hw[l.id]).length,ls=lastScore(u);
 const nextHw=LESSONS.find(l=>!u.prog.hw[l.id]&&hwDue(l.n-1)>new Date()&&(l.free||hasAccess(u)));
 const nextL=LESSONS.find(l=>!u.prog.lessons[l.id]&&(l.free||hasAccess(u)));
 return `<div class="kpis"><div class="kpi"><b>${lp}/${LESSONS.length}</b><span>Lessons completed</span></div><div class="kpi"><b>${hp}/${LESSONS.length}</b><span>Homework submitted</span></div><div class="kpi"><b>${ls?ls.score:'—'}</b><span>Latest score</span></div><div class="kpi"><b>${streak(u)} 🔥</b><span>Day streak</span></div></div>
 <div class="two"><div class="card"><h3>Your learning path</h3><div class="bar" style="margin:14px 0 6px"><i style="width:${Math.round(lp/LESSONS.length*100)}%"></i></div><div class="small mut">${Math.round(lp/LESSONS.length*100)}% of lessons completed</div>
 ${nextL?`<div class="item" style="margin-top:18px"><div class="grow"><div class="s">Continue with</div><h4>Lesson ${nextL.n} · ${esc(nextL.title)}</h4></div><button class="btn gold sm" data-act="tab" data-t="lessons" data-open="${nextL.id}">Open</button></div>`:''}
 ${nextHw?`<div class="item"><div class="grow"><div class="s">Next homework deadline</div><h4>Lesson ${nextHw.n} · ${fmtDT(hwDue(nextHw.n-1))}</h4><div class="s">${left(hwDue(nextHw.n-1)-Date.now())} left</div></div><button class="btn line sm" data-act="tab" data-t="lessons" data-open="${nextHw.id}">View</button></div>`:''}
 ${hasAccess(u)?'':`<div class="expl" style="margin-top:16px">You are on the free plan. <a style="color:var(--gold);font-weight:700" data-act="enrol" data-p="cohort">Enrol</a> to unlock all lessons, mocks and exams.</div>`}</div>
 <div class="card"><h3>Next live lesson</h3><div class="serif" style="font-size:26px;margin:10px 0">${fmtNext(nextClass())}</div><p class="small mut">Tue / Thu / Sat · 19:15–20:30<br>Free offline class every Sunday</p><div style="margin-top:14px"><a class="btn dark sm" href="https://t.me/${CONFIG.tg}" target="_blank" rel="noopener">Telegram teacher</a></div></div></div>`;
}
function catRow(ic,title,sub,acts){return `<div class="cat"><div class="ci">${ic}</div><div class="cb"><b>${title}</b><div class="s">${sub}</div>${acts?`<div class="acts">${acts}</div>`:''}</div></div>`}
function lessonBody(u,l){
 const st=hwStatus(u,l),due=hwDue(l.n-1);
 const vid=catRow('🎬','Recorded video lesson',l.video?'Watch the full recording of the live lesson.':'The recording will be uploaded after the live lesson.',l.video?`<button class="btn gold sm" data-act="openlesson" data-id="${l.id}">▶ Watch</button><button class="btn line sm" data-act="togglelesson" data-id="${l.id}">${u.prog.lessons[l.id]?'✓ Completed':'Mark complete'}</button>`:`<button class="btn line sm" data-act="togglelesson" data-id="${l.id}">${u.prog.lessons[l.id]?'✓ Completed':'Mark complete'}</button>`);
 const notes=catRow('📄','PDF lesson notes',l.notes?'Lesson notes in PDF format.':'PDF notes will be shared with this lesson.',l.notes?`<a class="btn gold sm" href="${esc(l.notes)}" target="_blank" rel="noopener">Open PDF</a>`:'');
 const mats=catRow('📎','Materials',l.materials.length?'Extra resources for this lesson.':'Materials will be added soon.',l.materials.map(m=>`<a class="btn line sm" href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.t)}</a>`).join(''));
 const hw=catRow('📝','Homework',(l.hw.text?esc(l.hw.text)+'<br>':'Homework will be posted after the live lesson.<br>')+`Deadline: <b>${fmtDT(due)}</b> · <span class="tag ${st.c}">${st.t}</span>`,`${l.hw.url?`<a class="btn gold sm" href="${esc(l.hw.url)}" target="_blank" rel="noopener">Homework PDF</a>`:''}<a class="btn line sm" href="${tgLink('Homework — Lesson '+l.n+' ('+l.title+') — '+u.name)}" target="_blank" rel="noopener">Send on Telegram</a><button class="btn ${u.prog.hw[l.id]?'line':'dark'} sm" data-act="hwdone" data-id="${l.id}">${u.prog.hw[l.id]?'✓ Submitted':'Mark as submitted'}</button>`);
 return vid+notes+mats+hw;
}
function dLessons(u){
 return `<p class="mut" style="margin-top:0">Each lesson has four parts. Homework is due at <b>19:59 on the day of the next lesson</b>.</p>`+LESSONS.map(l=>{
  const ok=l.free||hasAccess(u),open=S.openL===l.id&&ok,st=hwStatus(u,l);
  return `<div class="lcard ${ok?'':'lock'}"><button class="lhead" data-act="${ok?'openL':'locked'}" data-id="${l.id}"><span class="num">${l.n}</span><span class="grow"><h4>Lesson ${l.n} · ${esc(l.title)}</h4><span class="small mut">${esc(l.domain)} · Live ${fmtDT(liveAt(l.n-1))}</span></span>${ok?`<span class="tag ${u.prog.lessons[l.id]?'ok':''} hide-s">${u.prog.lessons[l.id]?'Completed':'In progress'}</span><span class="tag ${st.c} hide-s">HW: ${st.t}</span><span>${open?'▲':'▼'}</span>`:'<span class="tag">🔒 Locked</span>'}</button>${open?`<div class="lbody">${lessonBody(u,l)}</div>`:''}</div>`}).join('');
}
function dType(u){
 if(S.test)return testRunHtml();if(S.res)return testResHtml(u);
 if(!hasAccess(u))return gate('Type-based practice is available to enrolled students.');
 return `<p class="mut" style="margin-top:0">Practise one question type at a time. All practice materials will appear in each card.</p>`+D.map(d=>`<h3 style="margin:24px 0 12px;font-size:20px">${esc(d)}</h3><div class="grid g2">${TYPES.filter(t=>t[2]===d).map(t=>{const n=BANK.filter(q=>q.t===t[0]).length,m=TYPE_MATERIALS[t[0]]||{};return `<div class="card flat"><h3 style="font-size:18px">${esc(t[1])}</h3><p class="small" style="margin:6px 0 12px">${n} online question${n===1?'':'s'}</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn gold sm" data-act="starttype" data-id="${t[0]}">Practise</button>${m.notes?`<a class="btn line sm" href="${esc(m.notes)}" target="_blank" rel="noopener">Notes PDF</a>`:''}${m.sheet?`<a class="btn line sm" href="${esc(m.sheet)}" target="_blank" rel="noopener">Task sheet</a>`:''}${!m.notes&&!m.sheet?'<span class="tag">Materials coming soon</span>':''}</div></div>`}).join('')}</div>`).join('');
}
function dMock(u){
 if(S.test)return testRunHtml();if(S.res)return testResHtml(u);
 const hist=[...u.prog.tests].reverse();
 return `<h3 style="margin:0 0 12px">Online diagnostic</h3><div class="card" style="margin-bottom:24px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h3>Mini diagnostic</h3><p style="margin:6px 0 0">16 questions across all four domains · 20 minutes · instant explanations</p></div><span class="tag ok">Free</span></div><div style="margin-top:16px"><button class="btn gold sm" data-act="startdiag">Start diagnostic</button></div></div>
 <h3 style="margin:0 0 12px">SAT practice tests — Full DSAT mocks</h3><div class="grid g2">${MOCKS.map(m=>{const ok=hasAccess(u),sc=u.prog.mocks[m.id];return `<div class="card ${ok?'':'lock'}"><h3>${esc(m.name)}</h3><p style="margin:6px 0 14px">${esc(m.desc)}</p>${ok?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">${m.link?`<a class="btn gold sm" href="${esc(m.link)}" target="_blank" rel="noopener">Open test</a>`:'<span class="tag">Materials coming soon</span>'}</div><form data-form="mockscore" data-id="${m.id}" style="display:flex;gap:8px"><input name="score" type="number" min="200" max="800" step="10" placeholder="Your score (200–800)" value="${sc||''}" required style="padding:8px 12px"><button class="btn dark sm" type="submit">Save</button></form>`:`<button class="btn line sm" data-act="locked">🔒 Unlock</button>`}</div>`}).join('')}</div>
 <h3 style="margin:34px 0 12px">Results history</h3>${hist.length?`<div class="card flat scroll"><table><tr><th>Date</th><th>Test</th><th>Correct</th><th>Score</th><th></th></tr>${hist.map(r=>`<tr><td>${fdate(r.date)}</td><td>${esc(r.name)}</td><td>${r.correct}/${r.total}</td><td><b>${r.score}</b></td><td>${r.det&&r.det.length?`<button class="btn line sm" data-act="viewres" data-id="${r.id}">Review</button>`:''}</td></tr>`).join('')}</table></div>`:'<p class="mut">No results yet. Take the free diagnostic to get started.</p>'}`;
}
function examState(){const n=new Date(),dim=new Date(n.getFullYear(),n.getMonth()+1,0).getDate(),openDay=dim-CONFIG.examWindowDays+1;return{ym:ym(),min:CONFIG.targets[ym()],open:n.getDate()>=openDay,openDay,dim}}
function dExam(u){
 if(S.test)return testRunHtml();if(S.res)return testResHtml(u);
 if(!hasAccess(u))return gate('The monthly exam is available to enrolled students.');
 const e=examState(),done=u.prog.exams[e.ym],start=u.startYM||u.created.slice(0,7);
 const past=Object.keys(CONFIG.targets).filter(m=>m<=e.ym&&m>=start);
 const status=e.min==null?'<p class="mut">No exam is scheduled this month.</p>':done?`<div class="serif" style="font-size:44px">${done.score}</div><p class="small mut">Your ${fmonth(e.ym)} exam · minimum ${e.min} · ${done.score>=e.min?'<b style="color:var(--ok)">Target reached ✓</b>':'<b style="color:var(--bad)">Below target</b>'}</p>`:e.open?`<p style="margin:0 0 14px">The ${fmonth(e.ym)} exam is <b style="color:var(--ok)">open now</b>. Minimum score: <b>${e.min}</b>.</p><button class="btn gold" data-act="examrules">Start exam under exam conditions</button>`:`<p style="margin:0">The ${fmonth(e.ym)} exam opens on <b>${e.openDay} ${new Date().toLocaleDateString('en-GB',{month:'long'})}</b> and stays open until the end of the month. Minimum score: <b>${e.min}</b>.</p>`;
 return `<div class="card"><div class="eyebrow">Monthly exam</div><h3 style="margin:6px 0 14px">${fmonth(e.ym)}</h3>${status}</div>
 <h3 style="margin:28px 0 12px">Monthly targets</h3><div class="card flat scroll"><table><tr><th>Month</th><th>Minimum</th><th>Your score</th><th>Status</th></tr>${past.map(m=>{const r=u.prog.exams[m],ok=r&&r.score>=CONFIG.targets[m],cl=u.prog.cleared[m];return `<tr><td>${fmonth(m)}</td><td>${CONFIG.targets[m]}</td><td>${r?r.score:'—'}</td><td>${ok?'<span class="tag ok">Reached</span>':m===e.ym?'<span class="tag">In progress</span>':cl?'<span class="tag ok">Restored</span>':'<span class="tag bad">Missed</span>'}</td></tr>`}).join('')||'<tr><td colspan="4" class="mut">No targets yet.</td></tr>'}</table></div>
 <p class="small mut" style="margin-top:12px">Miss a month's minimum and your account turns red until you earn ${CONFIG.coinsToRestore} coins by solving math &amp; logic problems.</p>`;
}
function testRunHtml(){
 const t=S.test,q=t.qs[t.i];
 return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><span class="tag gold">${esc(t.name)}</span> <span class="small mut">Question ${t.i+1} of ${t.qs.length}</span>${t.exam?` <span class="tag ${t.leaves?'bad':''}">Exam mode · page leaves: ${t.leaves}</span>`:''}</div><div class="timer" id="tm">--:--</div></div>
 <div class="qnav">${t.qs.map((x,i)=>`<button class="qn ${i===t.i?'cur':''} ${t.ans[i]!=null?'ans':''}" data-act="qgo" data-i="${i}">${i+1}</button>`).join('')}</div>
 <div class="small mut" style="margin-bottom:8px">${t.exam?'':esc(q.d)}</div><div class="passage">${esc(q.p)}</div><b>${esc(q.q)}</b>
 ${q.o.map((o,i)=>`<button class="opt ${t.ans[t.i]===i?'sel':''}" data-act="qpick" data-i="${i}"><b>${'ABCD'[i]}.</b> ${esc(o)}</button>`).join('')}
 <div style="display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap"><button class="btn line" data-act="qprev" ${t.i===0?'disabled':''}>← Back</button><div style="display:flex;gap:10px">${t.i<t.qs.length-1?'<button class="btn dark" data-act="qnext">Next →</button>':''}<button class="btn gold" data-act="finish">Submit</button></div></div></div>`;
}
function testResHtml(u){

/* ---- tracker ---- */
function pieSvg(vals){
 const tot=vals.reduce((a,b)=>a+b,0);if(!tot)return '<div class="mut small">No study hours logged yet.</div>';
 let a0=-Math.PI/2,out='';const R=80,C=100;
 vals.forEach((v,i)=>{if(!v)return;const a1=a0+v/tot*2*Math.PI,large=a1-a0>Math.PI?1:0;
  if(v===tot)out+=`<circle cx="${C}" cy="${C}" r="${R}" fill="${CCOL[i]}"/>`;
  else out+=`<path d="M${C} ${C} L${C+R*Math.cos(a0)} ${C+R*Math.sin(a0)} A${R} ${R} 0 ${large} 1 ${C+R*Math.cos(a1)} ${C+R*Math.sin(a1)} Z" fill="${CCOL[i]}"/>`;a0=a1});
 return `<svg viewBox="0 0 200 200" width="190" height="190" role="img" aria-label="Study hours by category">${out}<circle cx="${C}" cy="${C}" r="44" fill="var(--card)"/><text x="${C}" y="${C-2}" text-anchor="middle" font-size="22" font-weight="700" font-family="Fraunces,serif" fill="var(--ink)">${(tot/60).toFixed(1)}</text><text x="${C}" y="${C+16}" text-anchor="middle" font-size="11" fill="var(--mut)">hours</text></svg>`;
}
function lineChart(pts){
 if(!pts.length)return '<p class="mut">Take a test to see your score trend.</p>';
 const W=520,H=190,pl=36,pb=26,pt=14,pr=14,mn=200,mx=800;
 const X=i=>pl+(pts.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(pts.length-1)),Y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb);
 const path=pts.map((p,i)=>(i?'L':'M')+X(i)+' '+Y(p.v)).join(' ');
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Score trend">${[200,400,600,800].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="4" y="${Y(v)+4}" font-size="11" fill="var(--mut)">${v}</text>`).join('')}<path d="${path}" fill="none" stroke="var(--gold)" stroke-width="2.5"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.v)}" r="4.5" fill="var(--gold)"/><text x="${X(i)}" y="${Y(p.v)-10}" font-size="11" text-anchor="middle" fill="var(--ink)">${p.v}</text>`).join('')}</svg>`;
}

  const fake={enrolled:'cohort',paidThrough:''};
  const mk=(lvl,days)=>{const sub=lvl==='over'?`Payment is ${days} day(s) overdue.`:`${days} day(s) left until your paid period ends.`;return `<div class="alert ${lvl}"><div class="ai">${lvl==='warn'?'⚠️':'🚨'}</div><div class="at"><b>Qarz munosabatni buzadi! Iltimos to'lovni amalga oshiring.</b><span>${sub}</span></div><button class="btn dark sm">Pay via Telegram</button></div>`};
  b=`<div class="card"><h3>Current rules</h3><ul class="ticks"><li>Payment warning: from ${CONFIG.warnDays} days before the paid-through date (amber), from ${CONFIG.urgentDays} days (red, pulsing), then overdue. Access locks ${CONFIG.graceDays} days after the date.</li><li>Homework deadline: 19:59 on the day of the next lesson (Tue / Thu / Sat).</li><li>Monthly exam opens during the last ${CONFIG.examWindowDays} days of each month (${CONFIG.examMins} min, exam conditions).</li><li>Minimum scores: ${Object.keys(CONFIG.targets).map(m=>fmonth(m)+' = '+CONFIG.targets[m]).join(', ')}.</li><li>A missed month turns the account red until the student earns ${CONFIG.coinsToRestore} coins (${CONFIG.coinsPerSolve} per solved problem).</li></ul></div>
  <h3 style="margin:26px 0 8px">Preview: payment warnings</h3>${mk('warn',6)}${mk('urgent',2)}${mk('over',1)}
  <h3 style="margin:26px 0 8px">Preview: Saturday announcement</h3>${satBanner(true)}
  <h3 style="margin:26px 0 8px">Preview: red account</h3><div class="alert red"><div class="ai">⛔</div><div class="at"><b>Your account is RED — monthly minimum score not reached</b><span>Earn ${CONFIG.coinsToRestore} coins by solving math &amp; logic problems to restore it.</span></div></div>`;
 }
 return `<div class="wrap"><div class="dhead"><div class="eyebrow">Admin</div><h2 class="h2" style="font-size:32px;margin-bottom:4px">Director's control room</h2></div><div class="tabs">${ATABS.map(t=>`<button class="tab ${S.atab===t[0]?'on':''}" data-act="atab" data-t="${t[0]}">${t[1]}</button>`).join('')}</div><div style="padding-bottom:70px">${b}</div></div>`;
}

/* ---------- draw ---------- */
function draw(){
 const y=window.scrollY,u=cur();let v=S.view;
 if((v==='dash'&&(!u||isAdmin(u)))||(v==='admin'&&!isAdmin(u))){v=u?(isAdmin(u)?'admin':'dash'):'login';S.view=v}
 $('#nav').innerHTML=navHtml();
 $('#app').innerHTML=v==='home'?homeHtml():v==='login'?loginHtml():v==='register'?registerHtml():v==='dash'?dashHtml(u):adminHtml();
 $('#foot').innerHTML=(v==='home'||v==='login'||v==='register')?footHtml():'';
 if(S.test&&v==='dash')tickTimer();
 window.scrollTo(0,y);
}

/* ---------- tests ---------- */
function tickTimer(){const el=$('#tm');if(!el||!S.test)return;const l=Math.max(0,Math.round((S.test.end-Date.now())/1000));el.textContent=String(Math.floor(l/60)).padStart(2,'0')+':'+String(l%60).padStart(2,'0');if(l<60)el.style.color='var(--bad)'}
function startRun(o){
 const idx=o.idx;S.test={name:o.name,tid:o.tid,qs:idx.map(i=>BANK[i]),idx,i:0,ans:{},start:Date.now(),end:Date.now()+o.mins*60000,exam:!!o.exam,cat:o.cat,leaves:0};S.res=null;
 clearInterval(tmr);tmr=setInterval(()=>{if(!S.test){clearInterval(tmr);return}tickTimer();if(Date.now()>=S.test.end)finishTest(true)},1000);draw();window.scrollTo(0,0);
}
function finishTest(auto){
 const t=S.test;if(!t)return;clearInterval(tmr);const u=cur();
 const det=t.idx.map((b,i)=>({b,pick:t.ans[i]!=null?t.ans[i]:null,ok:t.ans[i]===BANK[b].a})),c=det.filter(x=>x.ok).length;
 const rec={id:uid(),tid:t.tid,name:t.name,date:today(),correct:c,total:det.length,score:200+Math.round(c/det.length*60)*10,det};
 u.prog.tests.push(rec);u.prog.scores.push({date:today(),label:t.name,score:rec.score});
 addLog(u,(Date.now()-t.start)/60000,t.cat,t.name);
 if(t.exam)u.prog.exams[ym()]={score:rec.score,date:today(),leaves:t.leaves};
 save();S.test=null;S.res=rec;if(auto)toast("Time's up — submitted");draw();window.scrollTo(0,0);
}

/* ---------- payment via Telegram ---------- */
function openPay(pid){
 const u=cur();if(!u){S.pend=pid;go('register');return}
 if(isAdmin(u)){toast('Use a student account to enrol');return}
 const p=planOf(pid)||PLANS[0],renew=!!u.enrolled;
 const msg=`Hello! I'd like to ${renew?'renew':'enrol in'} SAT Cohort 1.0 — ${p.name} (${fmt(p.price)}).\nName: ${u.name}\nEmail: ${u.email}\nPhone: ${u.phone}`;
 modal(`<div class="eyebrow">Payment</div><h2 class="h2" style="font-size:28px">Pay securely via Telegram</h2>
 <div class="expl" style="border-left:3px solid var(--gold);margin:0 0 16px;color:var(--ink)">🛡 Taking into account the ever-increasing fraud cases in Uzbekistan, it is better to complete the payment one-on-one with the director on Telegram. Please do not send money to anyone else or through unknown links.</div>
 <div class="item"><div class="grow"><h4>${esc(p.name)}</h4><div class="s">${renew?'Renewal':'New enrolment'}</div></div><b class="serif" style="font-size:20px">${fmt(p.price)}</b></div>
 <ul class="ticks" style="margin-bottom:18px"><li>Message the director on Telegram (your details are filled in for you).</li><li>Complete the payment with him directly.</li><li>He sends you a personal promo code — your account is unlocked when you enter it below.</li></ul>
 <a class="btn gold full" href="${tgLink(msg)}" target="_blank" rel="noopener">✈ Pay via Telegram · @${CONFIG.tg}</a>
 <form data-form="promo" style="margin-top:22px;border-top:1px solid var(--line);padding-top:18px"><label>Already paid? Enter your promo code</label><div style="display:flex;gap:10px"><input name="code" placeholder="XXXX-XXXX" style="text-transform:uppercase" required><button class="btn dark" type="submit">Activate</button></div><div id="perr" class="err" style="margin:8px 0 0"></div></form>`);
}

/* ---------- actions ---------- */
const A={
 go:t=>go(t.dataset.v),
 scroll:t=>{S.menu=false;const id=t.dataset.t,f=()=>{const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})};if(S.view!=='home'){go('home');setTimeout(f,60)}else{draw();setTimeout(f,30)}},
 menu:()=>{S.menu=!S.menu;draw()},
 theme:()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'},
 fab:()=>$('#fab').classList.toggle('open'),
 close:()=>closeModal(),ovclose:(t,e)=>{if(e.target===t)closeModal()},
 logout:()=>{DB.session=null;save();go('home');toast('Logged out')},
 enrol:t=>{closeModal();openPay(t.dataset.p)},
 locked:()=>{const u=cur();if(!u){go('register');toast('Create a free account first')}else openPay('cohort')},
 sqpick:t=>{const i=S.sq?S.sq.i:0;S.sq={i,pick:+t.dataset.i};draw()},
 sqnext:()=>{S.sq={i:((S.sq?S.sq.i:0)+1)%BANK.length,pick:null};draw()},
 tab:t=>{const u=cur();if(S.test&&S.test.exam&&!confirm('Leaving now will submit your exam. Continue?'))return;if(S.test&&S.test.exam)finishTest();clearTimers();S.test=null;S.res=null;S.tab=t.dataset.t;if(t.dataset.open)S.openL=t.dataset.open;draw();window.scrollTo(0,0)},
 atab:t=>{S.atab=t.dataset.t;draw()},
 openL:t=>{S.openL=S.openL===t.dataset.id?null:t.dataset.id;draw()},
 togglelesson:t=>{const u=cur();u.prog.lessons[t.dataset.id]=!u.prog.lessons[t.dataset.id];save();draw()},
 hwdone:t=>{const u=cur(),id=t.dataset.id;if(u.prog.hw[id])delete u.prog.hw[id];else u.prog.hw[id]=today();save();draw();toast(u.prog.hw[id]?'Homework marked as submitted':'Updated')},
 openlesson:t=>{const u=cur(),l=LESSONS.find(x=>x.id===t.dataset.id);if(!l)return;const vid=/\.(mp4|webm|ogg)(\?|#|$)/i.test(l.video);
  modal(`<div class="eyebrow">Lesson ${l.n} · ${esc(l.domain)}</div><h2 class="h2" style="font-size:26px;margin-bottom:16px">${esc(l.title)}</h2>${vid?`<video class="video" controls preload="metadata" src="${esc(l.video)}"></video>`:`<div class="video"><div><div style="font-size:42px">▶</div><p style="margin:8px 0 14px">${l.video?'This lesson is hosted externally.':'The recording is being prepared.'}</p>${l.video?`<a class="btn gold sm" href="${esc(l.video)}" target="_blank" rel="noopener">Open video</a>`:''}</div></div>`}<div style="margin-top:18px"><button class="btn ${u.prog.lessons[l.id]?'line':'gold'}" data-act="modaldone" data-id="${l.id}">${u.prog.lessons[l.id]?'Mark as not completed':'Mark as complete ✓'}</button></div>`,true)},
 modaldone:t=>{const u=cur();u.prog.lessons[t.dataset.id]=!u.prog.lessons[t.dataset.id];save();closeModal();draw();toast('Updated')},
 startdiag:()=>startRun({name:'Mini diagnostic',tid:'diag',idx:BANK.map((q,i)=>i),mins:20,cat:'Mock tests'}),
 starttype:t=>{const ty=TYPES.find(x=>x[0]===t.dataset.id),idx=BANK.map((q,i)=>i).filter(i=>BANK[i].t===ty[0]);startRun({name:ty[1]+' practice',tid:'type:'+ty[0],idx,mins:Math.max(3,Math.ceil(idx.length*1.4)),cat:D.indexOf(ty[2])<2?'Reading':'Grammar & Writing'})},
 examrules:()=>modal(`<div class="eyebrow">Monthly exam</div><h2 class="h2" style="font-size:26px">Exam conditions</h2><ul class="ticks"><li>You have one attempt this month and ${CONFIG.examMins} minutes. The timer cannot be paused.</li><li>Leaving this page or switching tabs is recorded and shown to the teacher.</li><li>No explanations or hints until you submit.</li><li>Put your phone away, prepare scratch paper and sit somewhere quiet.</li></ul><button class="btn gold full" style="margin-top:18px" data-act="beginexam">I'm ready — begin</button>`),
 beginexam:()=>{closeModal();startRun({name:'Monthly exam · '+fmonth(ym()),tid:'exam:'+ym(),idx:shuffle(BANK.map((q,i)=>i)),mins:CONFIG.examMins,exam:true,cat:'Mock tests'})},
 qpick:t=>{S.test.ans[S.test.i]=+t.dataset.i;draw()},
 qgo:t=>{S.test.i=+t.dataset.i;draw()},qnext:()=>{S.test.i++;draw()},qprev:()=>{S.test.i--;draw()},
 finish:()=>{const n=S.test.qs.length-Object.keys(S.test.ans).length;if(n&&!confirm(n+' question(s) unanswered. Submit anyway?'))return;finishTest()},
 viewres:t=>{const u=cur();S.res=u.prog.tests.find(r=>r.id===t.dataset.id);S.tab='mock';draw();window.scrollTo(0,0)},
 backtests:()=>{S.res=null;draw()},
 vsub:t=>{clearInterval(mgT);S.vsub=t.dataset.t;S.vq=null;S.mg=null;S.jp=null;draw()},
 practicelist:t=>{S.vl=t.dataset.i;S.vsub='cards';S.fc=null;draw();window.scrollTo(0,0)},
 flip:()=>{S.fc.flip=!S.fc.flip;draw()},
 fcknown:()=>{const u=cur(),f=S.fc,k=f.i%f.deck.length;u.prog.known[f.deck[k]]=1;f.deck.splice(k,1);f.flip=false;save();draw()},
 fcagain:()=>{S.fc.i++;S.fc.flip=false;draw()},
 resetknown:()=>{cur().prog.known={};S.fc=null;save();draw()},
 startquiz:()=>{const P=pool(),n=Math.min(10,P.length),ws=shuffle(P).slice(0,n).map(w=>({w:w[0],def:w[1],o:shuffle([w[1],...shuffle(VOCAB.filter(x=>x[0]!==w[0])).slice(0,3).map(x=>x[1])])}));S.vq={qs:ws,i:0,score:0,pick:null};draw()},
 vqpick:t=>{const q=S.vq,c=q.qs[q.i];q.pick=+t.dataset.i;if(c.o[q.pick]===c.def)q.score++;draw()},
 vqnext:()=>{const q=S.vq;q.i++;q.pick=null;if(q.i>=q.qs.length){const u=cur();u.prog.quiz.push({date:today(),score:q.score});addLog(u,5,'Vocabulary','Vocabulary quiz');save()}draw()},
 startmatch:()=>{clearInterval(mgT);const ws=shuffle(pool()).slice(0,6),tiles=shuffle(ws.flatMap(w=>[{k:w[0],s:w[0],t:'w'},{k:w[0],s:w[1],t:'d'}]));S.mg={tiles,sel:null,done:[],moves:0,t:0,bad:null,started:false};draw()},
 mtile:t=>{const m=S.mg,i=+t.dataset.i;if(!m.started){m.started=true;mgT=setInterval(()=>{if(!S.mg||S.mg.done.length===6){clearInterval(mgT);return}S.mg.t++;const el=$('#mt');if(el)el.textContent=S.mg.t+'s'},1000)}
  if(m.sel===null){m.sel=i;m.bad=null;draw();return}
  if(m.sel===i)return;const a=m.tiles[m.sel],b=m.tiles[i];m.moves++;
  if(a.k===b.k&&a.t!==b.t){m.done.push(a.k);m.sel=null;m.bad=null;if(m.done.length===6){clearInterval(mgT);const u=cur();if(!u.prog.match||m.t<u.prog.match)u.prog.match=m.t;addLog(u,Math.max(1,m.t/60),'Vocabulary','Match game');save()}draw()}
  else{m.bad=i;m.sel=null;draw();setTimeout(()=>{if(S.mg===m){m.bad=null;draw()}},550)}},
 startjp:()=>{const cats=[...Array(NLISTS)].map((_,i)=>({name:'List '+(i+1),words:shuffle(listWords(i)).slice(0,5).map(w=>({w:w[0],def:w[1],o:shuffle([w[0],...shuffle(VOCAB.filter(x=>x[0]!==w[0])).slice(0,3).map(x=>x[0])])}))}));S.jp={cats,used:{},score:0,cur:null};draw()},
 jpclick:t=>{S.jp.cur={c:+t.dataset.c,r:+t.dataset.r,pick:null};draw()},
 jppick:t=>{const j=S.jp,c=j.cur,w=j.cats[c.c].words[c.r];c.pick=+t.dataset.i;if(w.o[c.pick]===w.w)j.score+=(c.r+1)*100;j.used[c.c+'-'+c.r]=1;draw()},
 jpback:()=>{const j=S.jp;j.cur=null;if(Object.keys(j.used).length===20){const u=cur();if(j.score>(u.prog.jp||0))u.prog.jp=j.score;addLog(u,8,'Vocabulary','Jeopardy');save()}draw()},
 piemode:t=>{S.pie=t.dataset.m;draw()},
 cppick:t=>{const u=cur(),p=S.cp;p.pick=+t.dataset.i;if(p.pick===p.a){let ok=true;if(p.id){if(u.prog.solved[p.id])ok=false;else u.prog.solved[p.id]=1}if(ok)u.prog.coins+=CONFIG.coinsPerSolve;save()}draw()},
 cpnext:()=>{S.cp=newProblem(cur());draw()},
 restore:()=>{const u=cur();if(u.prog.coins<CONFIG.coinsToRestore)return;u.prog.coins-=CONFIG.coinsToRestore;failedMonths(u).forEach(m=>u.prog.cleared[m]=1);save();draw();toast('Account restored — back to green!')},
 copycode:t=>{const g=S.gen,txt=`Your promo code: ${g.code}\nOpen SAT Cohort 1.0 → Account → "Activate with promo code" and enter it with your registered email (${g.email}). Valid until ${fdate(lastDay(g.ym))}.`;try{navigator.clipboard.writeText(txt).then(()=>toast('Message copied'),()=>toast('Copy failed'))}catch(e){toast('Copy not available')}},
 delcode:t=>{DB.codes=DB.codes.filter(c=>c.id!==t.dataset.id);save();draw()}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(f){if(t.tagName==='A'&&!t.getAttribute('href'))e.preventDefault();f(t,e)}});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.sel==='vl'){S.vl=e.target.value;S.fc=null;S.vq=null;S.mg=null;draw()}});
document.addEventListener('input',e=>{if(e.target.name==='code')e.target.value=e.target.value.toUpperCase()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.test&&S.test.exam)S.test.leaves++});

/* ---------- forms ---------- */
const FORMS={
 login:f=>{const d=Object.fromEntries(new FormData(f)),em=d.email.trim().toLowerCase();
  if(em===CONFIG.adminEmail&&hash(d.pass)===CONFIG.adminHash){DB.session='admin';save();toast('Welcome, director');go('admin');return}
  const u=DB.users.find(x=>x.email===em&&x.pass===hash(d.pass));
  if(!u){S.err='Incorrect email or password.';draw();return}DB.session=u.id;save();toast('Welcome back, '+u.name.split(' ')[0]);go('dash',{tab:'overview'});if(S.pend){const p=S.pend;S.pend=null;openPay(p)}},
 register:f=>{const d=Object.fromEntries(new FormData(f)),em=d.email.trim().toLowerCase();
  if(em===CONFIG.adminEmail||DB.users.some(x=>x.email===em)){S.err='An account with this email already exists.';draw();return}
  const u={id:uid(),name:d.name.trim(),email:em,phone:d.phone.trim(),pass:hash(d.pass),role:'student',target:+d.target,level:d.level,created:today(),enrolled:null,paidThrough:null,prog:newProg()};
  DB.users.push(u);DB.session=u.id;save();toast('Account created — welcome!');go('dash',{tab:'overview'});if(S.pend){const p=S.pend;S.pend=null;openPay(p)}},
 contact:f=>{const d=Object.fromEntries(new FormData(f)),text='Hello! I am '+d.name+'. '+d.msg+' (via SAT Cohort 1.0 website)';
  const url=d.via==='wa'?'https://wa.me/'+CONFIG.phone+'?text='+encodeURIComponent(text):tgLink(text);window.open(url,'_blank','noopener');toast('Opening '+(d.via==='wa'?'WhatsApp':'Telegram')+'…');f.reset()},
 profile:f=>{const d=Object.fromEntries(new FormData(f)),u=cur();u.name=d.name.trim();u.phone=d.phone.trim();u.target=+d.target;save();draw();toast('Profile saved')},
 log:f=>{const d=Object.fromEntries(new FormData(f)),u=cur();addLog(u,+d.min,d.cat,d.note);save();draw();toast('Study session logged')},
 mockscore:f=>{const d=Object.fromEntries(new FormData(f)),u=cur(),m=MOCKS.find(x=>x.id===f.dataset.id),s=Math.max(200,Math.min(800,Math.round(+d.score/10)*10));
  u.prog.mocks[m.id]=s;u.prog.scores=u.prog.scores.filter(x=>x.label!==m.name);u.prog.scores.push({date:today(),label:m.name,score:s});save();draw();toast('Score saved')},
 promo:f=>{const d=Object.fromEntries(new FormData(f)),u=cur(),err=$('#perr');if(!u||isAdmin(u))return;
  const m=matchCode(u.email,d.code||'');const fail=msg=>{if(err)err.textContent=msg;else toast(msg)};
  if(!m){fail('This code is not valid for your account email.');return}
  if(lastDay(m.ym)<today()){fail('This code has expired. Ask the director for a new one.');return}
  u.enrolled=m.plan;u.paidThrough=lastDay(m.ym);u.startYM=u.startYM||ym();save();closeModal();draw();toast('Activated! Access paid through '+fdate(u.paidThrough))},
 gencode:f=>{const d=Object.fromEntries(new FormData(f)),email=d.email.trim().toLowerCase(),code=makeCode(email,d.plan,d.ym);
  S.gen={code,email,plan:d.plan,ym:d.ym};DB.codes.push({id:uid(),date:today(),email,plan:d.plan,ym:d.ym,code});save();draw();toast('Code generated')}
};
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();FORMS[f.dataset.form]?.(f)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ---------- init ---------- */
(function(){const h=(location.hash||'').slice(1),u=cur();if(u&&['dash','admin'].includes(h))S.view=isAdmin(u)?'admin':'dash';else if(['login','register'].includes(h)&&!u)S.view=h;draw()})();
</script>
</body>
